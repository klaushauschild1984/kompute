name: 'Setup Build'
description: 'JDK 25 and Gradle setup shared across CI jobs. Run actions/checkout before this.'
runs:
    using: 'composite'
    steps:
        - name: Set up JDK 25
          uses: actions/setup-java@v6
          with:
              java-version: '25'
              distribution: 'temurin'

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6

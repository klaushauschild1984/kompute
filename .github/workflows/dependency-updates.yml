name: Dependency Updates

on:
    schedule:
        - cron: '0 8 * * 1'
    workflow_dispatch:

jobs:
    check-updates:
        name: Check for dependency updates
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  java-version: '25'
                  distribution: 'temurin'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Generate dependency update report (main build)
              run: ./gradlew dependencyUpdates

            - name: Generate dependency update report (buildSrc)
              run: ./gradlew -p buildSrc dependencyUpdates

            - name: Analyse updates and write summary
              run: >
                  python3 .github/scripts/analyse-updates.py
                  "Hauptbuild" build/dependencyUpdates/report.json
                  "buildSrc" buildSrc/build/dependencyUpdates/report.json

            - name: Upload HTML reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: dependency-updates-report
                  path: |
                      build/dependencyUpdates/report.html
                      buildSrc/build/dependencyUpdates/report.html
                  if-no-files-found: warn
